name: streamflix_tv
description: "Streamflix - Streaming app for Smart TV"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # HTTP client
  dio: ^5.7.0

  # Image caching
  cached_network_image: ^3.4.1

  # Native video player
  video_player: ^2.9.2

  # Browser-safe external link handling for web builds
  url_launcher: ^6.3.1

  # Web iframe support for browser builds
  web: ^1.1.0

  # WebView for Zoryva embeds (kept as fallback)
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.0
  webview_flutter_tizen: ^0.10.3
  path_provider_tizen: ^2.1.0

  # Loading skeletons
  shimmer: ^3.0.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
